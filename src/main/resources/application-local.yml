spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:cloud
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create

  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
      - io.awspring.cloud.autoconfigure.config.parameterstore.ParameterStoreAutoConfiguration

  # AWS 설정 비활성화
  cloud:
    aws:
      parameterstore:
        enabled: false
      s3:
        enabled: false